App\Entity\Location:
    properties:
        city:
            - NotBlank:
                  groups: ['create', 'edit']
            - Length:
                  min: 2
                  max: 100
                  minMessage: 'City name must be at least {{ limit }} characters.'
                  maxMessage: 'City name cannot be longer than {{ limit }} characters.'
                  groups: ['create', 'edit']

        country:
            - NotBlank:
                  groups: ['create', 'edit']
            - Length:
                  min: 2
                  max: 2
                  exactMessage: 'Country must be a valid 2-letter code (e.g. PL, DE).'
                  groups: ['create', 'edit']
            - Regex:
                  pattern: '/^[A-Z]{2}$/'
                  message: 'Country must be uppercase 2 letters.'
                  groups: ['create', 'edit']

        latitude:
            - NotBlank:
                  groups: ['create', 'edit']
            - Type:
                  type: numeric
                  message: 'Latitude must be a number.'
                  groups: ['create', 'edit']
            - Range:
                  min: -90
                  max: 90
                  notInRangeMessage: 'Latitude must be between -90 and 90.'
                  groups: ['create', 'edit']

        longitude:
            - NotBlank:
                  groups: ['create', 'edit']
            - Type:
                  type: numeric
                  message: 'Longitude must be a number.'
                  groups: ['create', 'edit']
            - Range:
                  min: -180
                  max: 180
                  notInRangeMessage: 'Longitude must be between -180 and 180.'
                  groups: ['create', 'edit']
