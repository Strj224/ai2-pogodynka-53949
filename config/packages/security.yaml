security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: username

    firewalls:
        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: app_login
                check_path: app_login
                default_target_path: app_location_index
            logout:
                path: app_logout
                target: app_login

    role_hierarchy:
        ROLE_ADMIN:
            - ROLE_USER
            - ROLE_LOCATION_INDEX
            - ROLE_LOCATION_SHOW
            - ROLE_LOCATION_NEW
            - ROLE_LOCATION_EDIT
            - ROLE_LOCATION_DELETE
            - ROLE_MEASUREMENT_INDEX
            - ROLE_MEASUREMENT_SHOW
            - ROLE_MEASUREMENT_NEW
            - ROLE_MEASUREMENT_EDIT
            - ROLE_MEASUREMENT_DELETE
        ROLE_USER:
            - ROLE_LOCATION_INDEX
            - ROLE_LOCATION_SHOW
            - ROLE_MEASUREMENT_INDEX
            - ROLE_MEASUREMENT_SHOW

    access_control:
        - { path: /, roles: PUBLIC_ACCESS }
